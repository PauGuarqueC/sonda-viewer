<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visor de sondes — incendis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
  :root{
    --bg: #eef0ef; --panel: #ffffff; --panel-border: #d5d5d5;
    --text: #262626; --text-dim: #5a5a5a; --charcoal: #2b2b2b;
    --red: #C8102E; --red-bg:#fbe7ea; --font-ui:'Roboto',sans-serif; --font-mono:'Roboto Mono',monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-ui); }
  header{ background:var(--panel); border-bottom:1px solid var(--panel-border); padding:14px 22px; }
  header h1{ font-size:18px; font-weight:700; margin:0; color:var(--charcoal); }
  header h1 span{ color:var(--red); }
  main{ padding:22px; max-width:900px; margin:0 auto; }
  .card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.05); padding:14px 18px; margin-bottom:12px;
    display:flex; justify-content:space-between; align-items:center; text-decoration:none; color:inherit;
  }
  .card:hover{ border-color:var(--red); }
  .card h2{ font-size:15px; font-weight:500; margin:0; color:var(--charcoal); }
  .card .meta{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); }
  #empty{ color:var(--text-dim); font-size:13px; }

  #gate{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:50;
  }
  #gate .box{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.08); padding:24px 26px; width:320px; max-width:90vw;
  }
  #gate h2{ font-size:15px; margin:0 0 12px; color:var(--charcoal); }
  #gate input{
    width:100%; padding:9px 10px; border:1px solid var(--panel-border); border-radius:5px;
    font-family:var(--font-mono); font-size:13.5px; box-sizing:border-box;
  }
  #gate button{
    margin-top:12px; width:100%; padding:9px; border:none; border-radius:5px; background:var(--red);
    color:#fff; font-size:13.5px; font-weight:500; cursor:pointer;
  }
  #gate .err{ color:var(--red); font-size:12px; margin-top:8px; display:none; }
</style>
</head>
<body>
<header>
  <h1>Visor de <span>sondes</span></h1>
  <a href="upload.html" style="float:right;font-size:12.5px;color:#5a5a5a;text-decoration:none;border:1px solid #d5d5d5;border-radius:5px;padding:6px 12px;">+ puja una sonda</a>
</header>
<main>
  <div id="list"></div>
  <div id="empty" style="display:none;"></div>
</main>

<div id="gate">
  <div class="box">
    <h2>Contrasenya de visualització</h2>
    <input type="password" id="gateInput" placeholder="contrasenya" autofocus>
    <button id="gateBtn">Entra</button>
    <div class="err" id="gateErr">Contrasenya incorrecta.</div>
  </div>
</div>

<script>
const KEY_STORAGE = 'sonda_view_key';

function tryDecrypt(ciphertext, passphrase){
  try{
    const bytes = CryptoJS.AES.decrypt(ciphertext, passphrase);
    const text = bytes.toString(CryptoJS.enc.Utf8);
    if(!text) return null; // clau incorrecta sol donar string buit, no excepcio
    return JSON.parse(text);
  } catch(e){
    return null;
  }
}

async function loadIndex(passphrase){
  const res = await fetch('data/incendis_index.json.enc');
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const ciphertext = await res.text();
  return tryDecrypt(ciphertext, passphrase);
}

function renderList(items){
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  if(!items.length){
    empty.textContent = 'Encara no hi ha cap incendi registrat.';
    empty.style.display = 'block';
    return;
  }
  list.innerHTML = items.map(it => `
    <a class="card" href="incendi.html?i=${encodeURIComponent(it.slug)}">
      <h2>${it.nom}</h2>
      <span class="meta">${it.n_sondes} sond${it.n_sondes===1?'a':'es'} · actualitzat ${it.actualitzat || '—'}</span>
    </a>`).join('');
}

async function unlock(passphrase){
  let items;
  try{
    items = await loadIndex(passphrase);
  } catch(err){
    document.getElementById('empty').textContent = 'No s\'ha pogut carregar la llista d\'incendis.';
    document.getElementById('empty').style.display = 'block';
    document.getElementById('gate').style.display = 'none';
    return;
  }
  if(items === null){
    document.getElementById('gateErr').style.display = 'block';
    localStorage.removeItem(KEY_STORAGE);
    return;
  }
  localStorage.setItem(KEY_STORAGE, passphrase);
  document.getElementById('gate').style.display = 'none';
  renderList(items);
}

document.getElementById('gateBtn').addEventListener('click', () => {
  unlock(document.getElementById('gateInput').value);
});
document.getElementById('gateInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') unlock(e.target.value);
});

const stored = localStorage.getItem(KEY_STORAGE);
if(stored){
  unlock(stored);
}
</script>
</body>
</html>
