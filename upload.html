<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pujar sonda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0ef; --panel:#ffffff; --panel-border:#d5d5d5; --text:#262626; --text-dim:#5a5a5a;
    --charcoal:#2b2b2b; --red:#C8102E; --red-bg:#fbe7ea; --green:#2e7d46; --green-bg:#e5f3ea;
    --font-ui:'Roboto',sans-serif; --font-mono:'Roboto Mono',monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-ui); }
  header{ background:var(--panel); border-bottom:1px solid var(--panel-border); padding:14px 22px; }
  header h1{ font-size:18px; font-weight:700; margin:0; color:var(--charcoal); }
  header h1 span{ color:var(--red); }
  main{ max-width:460px; margin:26px auto; padding:0 16px; }
  .card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.05); padding:18px 20px; margin-bottom:16px;
  }
  label{ display:block; margin:14px 0 5px; font-size:12.5px; color:var(--text-dim); }
  input[type=text], input[type=password], select, input[type=file]{
    width:100%; padding:9px 10px; border:1px solid var(--panel-border); border-radius:5px;
    font-size:13.5px; font-family:var(--font-mono); box-sizing:border-box; background:#fff; color:var(--text);
  }
  button{
    margin-top:18px; padding:10px 18px; border:none; border-radius:5px; background:var(--red);
    color:#fff; font-size:14px; font-weight:500; cursor:pointer;
  }
  button:disabled{ background:#c9a6ac; cursor:default; }
  button.secondary{ background:transparent; color:var(--text-dim); border:1px solid var(--panel-border); }
  .status{ font-family:var(--font-mono); font-size:12.5px; padding:10px 12px; border-radius:5px; margin-top:14px; line-height:1.5; white-space:pre-wrap; }
  .status.ok{ background:var(--green-bg); color:var(--green); }
  .status.ko{ background:var(--red-bg); color:var(--red); }
  .status.wait{ background:#f0f0f0; color:var(--text-dim); }
  .token-row{ display:flex; gap:8px; align-items:center; }
  .token-row input{ flex:1; }
  .hint{ font-size:11.5px; color:var(--text-dim); margin-top:6px; line-height:1.5; }
  a{ color:var(--red); }
</style>
</head>
<body>
<header><h1>Pujar <span>sonda</span></h1></header>
<main>

  <div class="card" id="tokenCard">
    <label>Contrasenya de pujada</label>
    <div class="token-row">
      <input type="password" id="token" placeholder="contrasenya compartida">
      <button type="button" id="saveToken">Desa</button>
    </div>
    <div class="hint">
      Es desa només al teu navegador. Aquesta contrasenya no dona accés
      directe al repo — un petit proxy (Cloudflare Worker) és qui parla amb
      GitHub, amb el seu propi token, que mai arriba al navegador.
    </div>
  </div>

  <div class="card">
    <form id="uploadForm">
      <label>ZIP del llançament</label>
      <input type="file" id="zipfile" accept=".zip" required>

      <label>Incendi</label>
      <input type="text" id="incendi" list="incendisList" required placeholder="p.ex. Alfarràs">
      <datalist id="incendisList"></datalist>

      <label>Tipus de sonda</label>
      <select id="tipus" required>
        <option value="ambient">ambient</option>
        <option value="columna">columna</option>
      </select>

      <button type="submit" id="submitBtn">Puja i processa</button>
    </form>
    <div id="status"></div>
  </div>

</main>

<script>
// ---- Configuracio ----
const OWNER = "PauGuarqueC";
const REPO = "sonda-viewer";
const BRANCH = "main";
const WORKER_URL = "https://sonda-upload-proxy.pguarque.workers.dev";
// -----------------------

const tokenInput = document.getElementById('token');
const TOKEN_KEY = 'sonda_upload_password';
tokenInput.value = localStorage.getItem(TOKEN_KEY) || '';

document.getElementById('saveToken').addEventListener('click', () => {
  localStorage.setItem(TOKEN_KEY, tokenInput.value.trim());
  setStatus('Contrasenya desada en aquest navegador.', 'ok');
});

function setStatus(msg, kind){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (kind || 'wait');
}

function slugify(text){
  return text.normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'incendi';
}

async function loadKnownIncendis(){
  // L'índex ara està xifrat; sense la contrasenya de visualització no es
  // pot desxifrar aquí, així que l'autocompletar d'incendis coneguts queda
  // desactivat des del formulari de pujada. No bloqueja res: simplement
  // s'escriu el nom de l'incendi a mà.
}
loadKnownIncendis();

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('uploadForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const password = tokenInput.value.trim();
  if(!password){ setStatus('Cal la contrasenya de pujada (a dalt).', 'ko'); return; }

  const fileInput = document.getElementById('zipfile');
  const file = fileInput.files[0];
  const incendiNom = document.getElementById('incendi').value.trim();
  const tipus = document.getElementById('tipus').value;

  if(!file || !incendiNom){ setStatus('Falten camps obligatoris.', 'ko'); return; }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  setStatus('Pujant el ZIP...', 'wait');

  try{
    const zipBase64 = await fileToBase64(file);

    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        password, incendi: incendiNom, tipus,
        filename: file.name, zipBase64
      })
    });
    const data = await res.json().catch(() => ({}));

    if(!res.ok){
      throw new Error(data.error || `Error del servidor (${res.status})`);
    }

    setStatus(
      `Fet! "${incendiNom}" / ${data.sondId} pujat.\n` +
      `GitHub Actions el processarà en un minut o dos.\n` +
      `Comprova'l a: https://github.com/${OWNER}/${REPO}/actions`,
      'ok'
    );
    document.getElementById('uploadForm').reset();
  } catch(err){
    setStatus('Error: ' + err.message, 'ko');
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
